<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a8322a">
  <meta name="description" content="Visor de la evolución histórica de Sofía: de la Serdica romana y el Sredets medieval a la capital búlgara de hoy.">
  <title>Sofía en el tiempo · visorgis_sofia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600&display=swap">

  <!-- OpenLayers: primero la copia local (lib/), si no existe, CDN -->
  <link rel="stylesheet" href="../comun/lib/ol/ol.css"
        onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/ol@10.5.0/ol.css'">
  <script>
    // Si el navegador tiene guardado un index.html antiguo, recarga con la versión publicada
    // (GitHub Pages deja la página en caché unos minutos). VERSION se actualiza en cada publicación.
    (function () {
      var VERSION = '202611242332';
      if (location.protocol.indexOf('http') !== 0) return;
      fetch('../version.txt', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
        v = (v || '').trim();
        if (v && v !== VERSION && sessionStorage.getItem('recargado') !== v) {
          try { sessionStorage.setItem('recargado', v); } catch (e) {}
          location.replace(location.pathname + '?v=' + v + location.hash);
        }
      }).catch(function () {});
    })();
  </script>
  <script src="../comun/lib/ol/ol.js"></script>
  <script>
    if (!window.ol) {
      console.info('lib/ol no encontrado: cargando OpenLayers desde CDN');
      document.write('<script src="https://cdn.jsdelivr.net/npm/ol@10.5.0/dist/ol.js"><\/script>');
    }
  </script>
  <link rel="stylesheet" href="../comun/comun.css?v=202611242332">
  <link rel="stylesheet" href="css/visor.css?v=202611242332">
</head>
<body>
  <div id="mapa"></div>

  <header class="cabecera">
    <h1><span class="cir">София</span>Sofía <span>en el tiempo</span></h1>
    <select id="favoritos" aria-label="Ir a un lugar">
      <option value="">Ir a…</option>
    </select>
  </header>

  <div class="sofia-botones">
    <button id="capa-base" class="sofia-redondo" aria-label="Cambiar mapa base"></button>
    <button id="gps" class="sofia-redondo" title="Mi posición" aria-label="Mi posición"></button>
  </div>

  <aside class="panel">
    <button id="plegar" class="plegar" title="Plegar panel">⟨</button>
    <div class="panel-cuerpo">
      <div class="panel-cabecera" id="panel-cabecera">
        <div id="anio" class="anio">—</div>
        <span id="tipo" class="tipo"></span>
        <h2 id="titulo"></h2>
      </div>
      <button id="narrar" class="narrador" disabled></button>
      <div id="leyenda-rec" class="leyenda-rec" hidden>
        <span><i class="l-actual"></i>Límite de la ciudad en esa época (muralla o mancha urbana)</span>
        <span><i class="l-anterior"></i>Límites anteriores</span>
        <span><i class="l-puerta"></i>Puertas</span>
        <span><i class="l-hito"></i>Hitos</span>
        <span><i class="l-barrio"></i>Barrios nuevos</span>
        <span class="l-yac-item" id="leyenda-yac" hidden><i class="l-yac"></i>Yacimientos (zona aproximada)</span>
      </div>
      <div class="opacidad">
        <label for="opacidad">Opacidad <b id="opacidad-valor">100%</b></label>
        <input type="range" id="opacidad" min="0" max="100" step="5" value="100" aria-label="Opacidad de la capa histórica">
      </div>
      <div id="descripcion" class="descripcion"></div>
      <button id="expandir" class="expandir" aria-expanded="false">Leer más</button>
      <p id="fuente" class="fuente"></p>
      <div class="opciones">
        <label><input type="checkbox" id="chk-perimetros" checked> Límites, puertas e hitos</label>
        <label><input type="checkbox" id="chk-calles"> Calles y nombres actuales</label>
      </div>
      <p class="ayuda">← → cambiar de año · espacio reproducir · H comparar con hoy</p>
    </div>
  </aside>

  <div id="cargando" class="cargando">Cargando teselas…</div>

  <footer class="timeline">
    <div class="botones">
      <button id="prev" title="Año anterior (←)" aria-label="Año anterior"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M6 5h2.5v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button id="play" title="Reproducir (espacio)" aria-label="Reproducir"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15L19.5 12z"/></svg></button>
      <button id="next" title="Año siguiente (→)" aria-label="Año siguiente"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M15.5 5H18v14h-2.5zM4 5l10.5 7L4 19z"/></svg></button>
      <button id="hoy" class="hoy" title="Comparar con la imagen actual (H)">Ver hoy</button>
    </div>
    <div class="pista-scroll">
      <div class="pista">
        <input id="slider" type="range" min="0" max="1" step="0.01" value="0" aria-label="Año">
        <div id="marcas" class="marcas"></div>
      </div>
    </div>
    <div class="leyenda">
      <span><i class="recreacion"></i> Recreaciones e historia</span>
      <span><i class="foto"></i> Fotografía aérea</span>
    </div>
  </footer>

  <script src="../comun/comun.js?v=202611242332"></script>
  <script src="js/capas.js?v=202611242332"></script>
  <script src="js/visor.js?v=202611242332"></script>
</body>
</html>
