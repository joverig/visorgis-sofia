<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#a8322a">
  <meta name="description" content="Los lugares imprescindibles de Sofía, su historia y rutas a pie entre ellos.">
  <title>Viajando por Sofía</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600&display=swap">
  <script>
    (function () {
      var VERSION = '202611231116';
      if (location.protocol.indexOf('http') !== 0) return;
      fetch('../version.txt', { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (v) {
        v = (v || '').trim();
        if (v && v !== VERSION && sessionStorage.getItem('recargado') !== v) {
          try { sessionStorage.setItem('recargado', v); } catch (e) {}
          location.replace(location.pathname + '?v=' + v + location.hash);
        }
      }).catch(function () {});
    })();
  </script>
  <link rel="stylesheet" href="../comun/lib/ol/ol.css">
  <script src="../comun/lib/ol/ol.js"></script>
  <script>
    if (!window.ol) document.write('<script src="https://cdn.jsdelivr.net/npm/ol@10.5.0/dist/ol.js"><\/script>');
  </script>
  <link rel="stylesheet" href="../comun/comun.css?v=202611231116">
  <link rel="stylesheet" href="css/viajando.css?v=202611231116">
</head>
<body>
  <div id="mapa"></div>

  <header class="cabecera">
    <h1>Viajando <span>por Sofía</span></h1>
  </header>

  <div class="botones-mapa">
    <button id="gps" class="redondo" title="Mi posición" aria-label="Mi posición">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 3h-2.06A7 7 0 0 0 13 5.06V3h-2v2.06A7 7 0 0 0 5.06 11H3v2h2.06A7 7 0 0 0 11 18.94V21h2v-2.06A7 7 0 0 0 18.94 13H21zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
    </button>
    <button id="capa" class="redondo" title="Cambiar a satélite" aria-label="Cambiar mapa base">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="m12 3 9 5-9 5-9-5zm-7.2 8.6L12 15.6l7.2-4 1.8 1L12 17.6l-9-5zm0 4L12 19.6l7.2-4 1.8 1L12 21.6l-9-5z"/></svg>
    </button>
  </div>

  <aside class="panel" id="panel">
    <div class="tirador" id="tirador" aria-hidden="true"></div>
    <div class="panel-cuerpo" id="cuerpo">
      <!-- Portada: lista de lugares -->
      <section id="vista-lista">
        <p class="intro">Toca un lugar en el mapa o en la lista para conocer su historia y los caminos a pie que salen de él.</p>
        <div class="filtros" id="filtros"></div>
        <ul class="lista" id="lista"></ul>
      </section>
      <!-- Ficha de un lugar -->
      <section id="vista-ficha" hidden>
        <button class="volver-lista" id="volver-lista">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.5 5.5 8 12l6.5 6.5 1.5-1.5-5-5 5-5z"/></svg>Todos los lugares
        </button>
        <span class="categoria" id="f-categoria"></span>
        <h2 id="f-nombre"></h2>
        <p class="distancia-yo" id="f-yo" hidden></p>
        <p class="resumen" id="f-resumen"></p>
        <button id="narrar" class="narrador" disabled></button>
        <div class="historia" id="f-historia"></div>
        <button class="leer-mas" id="leer-mas">Leer la historia completa</button>
        <h3>Caminos a pie desde aquí</h3>
        <ul class="rutas" id="f-rutas"></ul>
        <p class="sin-rutas" id="f-sin-rutas" hidden>Las rutas a pie se están preparando.</p>
      </section>
    </div>
  </aside>

  <script src="../comun/comun.js?v=202611231116"></script>
  <script src="js/viajando.js?v=202611231116"></script>
</body>
</html>
