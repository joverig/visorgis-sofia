<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Borrador · red de rutas</title><link rel="stylesheet" href="comun/lib/ol/ol.css"><script src="comun/lib/ol/ol.js"></script>
<style>html,body,#m{margin:0;height:100%}#t{position:absolute;top:10px;left:50px;background:#fffaf1;padding:8px 12px;border-radius:10px;font:14px Segoe UI,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.2)}</style></head>
<body><div id="m"></div><div id="t"><b>Borrador de la red</b> · 48 conexiones en línea recta (aún no siguen calles)</div><script>
const P={"type": "FeatureCollection", "name": "puntos_viajando_sofia", "metadata": {"aviso": "Coordenadas aproximadas; textos de elaboración propia."}, "features": [{"type": "Feature", "properties": {"id": "nevski", "nombre": "Catedral de Alejandro Nevski", "categoria": "religioso", "resumen": "El gran símbolo de Sofía: cúpulas doradas en memoria de los soldados rusos de la liberación.", "historia": ["Se proyectó en 1882, pocos años después de la liberación de Bulgaria, como homenaje a los cerca de doscientos mil soldados rusos muertos en la guerra ruso-turca de 1877-1878. La obra principal, del arquitecto ruso Alexander Pomerantsev, se levantó entre 1904 y 1912 en estilo neobizantino, con mármoles italianos, ónice de Brasil y alabastro, y una cúpula central dorada que domina el perfil de la ciudad.", "Está dedicada a san Alejandro Nevski, príncipe ruso y patrón del zar libertador Alejandro II. Cuando Bulgaria luchó contra Rusia en la Primera Guerra Mundial, la catedral cambió durante unos años su advocación por la de los santos Cirilo y Metodio, y recuperó su nombre en los años veinte.", "Caben varios miles de fieles y su campanario guarda doce campanas. En la cripta, la Galería Nacional expone una de las mejores colecciones de iconos ortodoxos de los Balcanes."]}, "geometry": {"type": "Point", "coordinates": [23.33276, 42.69577]}}, {"type": "Feature", "properties": {"id": "santasofia", "nombre": "Basílica de Santa Sofía", "categoria": "religioso", "resumen": "La iglesia del siglo VI que acabó dando nombre a la ciudad.", "historia": ["Es una basílica de ladrillo de época de Justiniano, del siglo VI, levantada sobre una necrópolis romana en la que ya habían existido varias iglesias anteriores. Su sobriedad contrasta con el dorado de Alejandro Nevski, a pocos pasos: es la arquitectura de la Serdica tardorromana que sobrevivió a hunos, eslavos y otomanos.", "Desde el siglo XIV su nombre, Sveta Sofia, la Santa Sabiduría, pasó a designar a toda la ciudad. En el siglo XVI los otomanos la convirtieron en mezquita; los terremotos del siglo XIX derribaron su minarete y quedó abandonada hasta su restauración en el siglo XX.", "Bajo el templo se visita la necrópolis paleocristiana, con tumbas pintadas. Junto a su muro arde la llama de la Tumba del Soldado Desconocido, y en el jardín está enterrado el escritor Iván Vázov."]}, "geometry": {"type": "Point", "coordinates": [23.33116, 42.69636]}}, {"type": "Feature", "properties": {"id": "rusa", "nombre": "Iglesia rusa de San Nicolás", "categoria": "religioso", "resumen": "Cúpulas de cebolla doradas en pleno bulevar Tsar Osvoboditel.", "historia": ["Se construyó entre 1907 y 1914 como iglesia de la embajada rusa, sobre el solar de una antigua mezquita, siguiendo el estilo de las iglesias moscovitas del siglo XVII: fachada blanca con azulejos verdes y cinco cúpulas de cebolla doradas. Su arquitecto fue Mijaíl Preobrazhenski.", "Durante el régimen comunista siguió abierta, aunque vigilada. En su cripta descansa el arzobispo ruso Serafín Sobolev, muy venerado en Bulgaria: los fieles le dejan notas escritas con sus deseos en una caja junto a la tumba."]}, "geometry": {"type": "Point", "coordinates": [23.32855, 42.6954]}}, {"type": "Feature", "properties": {"id": "serdica", "nombre": "Complejo arqueológico Serdica", "categoria": "roma", "resumen": "Calles, casas y termas de la ciudad romana, a la vista entre dos líneas de metro.", "historia": ["Las obras de la segunda línea de metro, entre 2010 y 2012, sacaron a la luz el corazón de la antigua Serdica: calles enlosadas, casas con mosaicos, unas termas y una basílica paleocristiana. En lugar de volver a enterrarlo, se conservó bajo una cubierta de cristal y desde 2016 se visita al aire libre, junto a la estación Serdica.", "Aquí se cruzaban las dos calles principales de la ciudad, el cardo y el decumano, cerca del foro que estaba bajo la actual plaza Sveta Nedelya. Encima, en el paso subterráneo, sobrevive la pequeña iglesia medieval de Sveta Petka Samardzhiyska, medio enterrada.", "Sobre la plaza se alza desde el año 2000 la estatua de Santa Sofía, en el lugar donde antes estuvo la de Lenin."]}, "geometry": {"type": "Point", "coordinates": [23.32257, 42.69766]}}, {"type": "Feature", "properties": {"id": "nedelya", "nombre": "Iglesia de Sveta Nedelya", "categoria": "religioso", "resumen": "La catedral de la ciudad, escenario del atentado más sangriento de la historia de Bulgaria.", "historia": ["Ocupa un lugar sagrado desde hace siglos: sobre el foro romano hubo una iglesia medieval de madera y piedra, reconstruida muchas veces. Guarda las reliquias del rey serbio Esteban Milutin, por lo que durante siglos se la llamó también Sveti Kral, el Santo Rey.", "El 16 de abril de 1925 un grupo vinculado al Partido Comunista hizo estallar una bomba en la cúpula durante el funeral de un general, para atentar contra el zar Boris III y el gobierno. El zar no estaba, pero murieron más de 150 personas. El templo actual es la reconstrucción de 1927-1933."]}, "geometry": {"type": "Point", "coordinates": [23.32124, 42.69655]}}, {"type": "Feature", "properties": {"id": "rotonda", "nombre": "Rotonda de San Jorge", "categoria": "roma", "resumen": "El edificio más antiguo en pie de Sofía, del siglo IV, escondido en un patio.", "historia": ["Esta rotonda de ladrillo rojo se levantó en el siglo IV, en época de Constantino, quizá como parte de unas termas o como baptisterio, y pronto se convirtió en iglesia. Es el edificio más antiguo que sigue en pie en la ciudad.", "En su interior se conservan varias capas de frescos de los siglos X al XIV. En el siglo XVI los otomanos la transformaron en mezquita y cubrieron las pinturas, que reaparecieron en las restauraciones del siglo XX.", "Hoy está en el patio interior que forman la Presidencia y un hotel, rodeada de restos de calles y edificios de la Serdica romana."]}, "geometry": {"type": "Point", "coordinates": [23.32332, 42.69689]}}, {"type": "Feature", "properties": {"id": "largo", "nombre": "El Largo y la Presidencia", "categoria": "edificio", "resumen": "El gran conjunto estalinista de los años 50, con el cambio de guardia a la puerta de la Presidencia.", "historia": ["Los bombardeos aliados de 1943-1944 arrasaron esta zona, y el régimen comunista levantó aquí en los años 50 el Largo: tres edificios monumentales de clasicismo socialista que encierran una plaza. El más alto fue la sede del Partido Comunista, con una estrella roja en lo alto que hoy se conserva en el Museo de Arte Socialista.", "En el ala sur está la Presidencia de la República, con su guardia de honor de uniformes blancos, rojos y verdes; el cambio de guardia se hace cada hora. Bajo la plaza, en el paso subterráneo, se ven los restos de la puerta este de Serdica."]}, "geometry": {"type": "Point", "coordinates": [23.3242, 42.6976]}}, {"type": "Feature", "properties": {"id": "arqueologico", "nombre": "Museo Arqueológico Nacional", "categoria": "museo", "resumen": "Tesoros tracios en la mayor mezquita otomana que tuvo la ciudad.", "historia": ["El museo ocupa la Büyük Camii, la Gran Mezquita, construida a finales del siglo XV: con nueve cúpulas, fue la mayor de la Sofía otomana. Tras la liberación dejó de ser mezquita y, desde comienzos del siglo XX, alberga el museo arqueológico más importante del país.", "Entre sus piezas destacan tesoros de oro tracios, esculturas y lápidas romanas de Serdica y objetos de la Edad Media búlgara. Es un buen lugar para entender que la historia de Sofía empieza mucho antes de los romanos."]}, "geometry": {"type": "Point", "coordinates": [23.32458, 42.69704]}}, {"type": "Feature", "properties": {"id": "banyabashi", "nombre": "Mezquita de Banya Bashi", "categoria": "religioso", "resumen": "La única mezquita en uso de Sofía, levantada sobre aguas termales.", "historia": ["Se terminó en 1576 y se atribuye al taller del gran arquitecto otomano Mimar Sinan. Su nombre significa «muchos baños», porque se construyó sobre las fuentes termales que llevan alimentando a la ciudad desde la Antigüedad.", "De las decenas de mezquitas que tuvo la Sofya otomana es la única que sigue abierta al culto. En invierno a veces se ve salir vapor del suelo de los alrededores: es el agua caliente que corre bajo el centro."]}, "geometry": {"type": "Point", "coordinates": [23.32253, 42.70004]}}, {"type": "Feature", "properties": {"id": "banos", "nombre": "Baños Minerales Centrales", "categoria": "museo", "resumen": "Un balneario de 1913 convertido en Museo de Historia de Sofía, con fuentes de agua caliente en la calle.", "historia": ["Los baños públicos se inauguraron en 1913 sobre los manantiales que dieron origen a la ciudad. Su arquitectura, de los arquitectos Petko Momchilov y Friedrich Grünanger, mezcla la Secesión vienesa con motivos bizantinos y búlgaros en cerámica de colores.", "Funcionaron como baños hasta los años 80. Restaurado, el edificio acoge desde 2015 el Museo Regional de Historia de Sofía, con salas que van de Serdica a la corte de los zares.", "En el jardín de al lado hay fuentes públicas de agua mineral caliente, y es habitual ver a vecinos llenando garrafas."]}, "geometry": {"type": "Point", "coordinates": [23.32418, 42.70037]}}, {"type": "Feature", "properties": {"id": "halite", "nombre": "Mercado Central (Tsentralni Hali)", "categoria": "mercado", "resumen": "El mercado cubierto de 1911, con su torre del reloj sobre el bulevar Maria Luiza.", "historia": ["Se inauguró en 1911 según un proyecto del arquitecto Naum Torbov, con una estructura metálica cubierta de fachadas neorrenacentistas y una torre con reloj. Fue el gran mercado de abastos de la nueva capital.", "Durante las obras de construcción aparecieron restos de la Serdica romana, que hoy se pueden ver en el sótano. Ahora combina puestos de comida, cafés y tiendas."]}, "geometry": {"type": "Point", "coordinates": [23.3219, 42.69935]}}, {"type": "Feature", "properties": {"id": "sinagoga", "nombre": "Sinagoga de Sofía", "categoria": "religioso", "resumen": "Una de las mayores sinagogas sefardíes de Europa, de 1909.", "historia": ["Se inauguró en 1909, obra del arquitecto vienés Friedrich Grünanger en estilo neomorisco, inspirada en la gran sinagoga sefardí de Viena. Su cúpula y su enorme lámpara de bronce la hacen una de las sinagogas más grandes de Europa.", "La comunidad judía de Sofía hablaba judeoespañol, heredado de los sefardíes expulsados de España en 1492. En 1943 la presión de políticos, de la Iglesia ortodoxa y de buena parte de la sociedad impidió la deportación de los judíos de Bulgaria; no ocurrió lo mismo en los territorios que Bulgaria ocupaba en Macedonia y Tracia.", "Un pequeño museo en el edificio cuenta la historia de los judíos búlgaros."]}, "geometry": {"type": "Point", "coordinates": [23.3204, 42.69975]}}, {"type": "Feature", "properties": {"id": "zhenski", "nombre": "Mercado de las Mujeres (Zhenski Pazar)", "categoria": "mercado", "resumen": "El mercado al aire libre más antiguo y bullicioso de la ciudad.", "historia": ["Su origen se remonta a los bazares otomanos, y el nombre viene de las mujeres de los pueblos cercanos que venían a vender sus productos. Ocupa varias manzanas a lo largo de la calle Stefan Stambolov.", "Es un buen lugar para ver la Sofía cotidiana: fruta, especias, quesos, ropa y cacharros, entre vecinos de toda la vida y comerciantes de muchos orígenes. Algunas fachadas del barrio conservan el aire de principios del siglo XX."]}, "geometry": {"type": "Point", "coordinates": [23.3176, 42.7012]}}, {"type": "Feature", "properties": {"id": "leones", "nombre": "Puente de los Leones", "categoria": "monumento", "resumen": "Cuatro leones de bronce vigilan el paso sobre el río Vladayska desde 1891.", "historia": ["Se construyó entre 1889 y 1891 por los hermanos checos Prošek, en el lugar de un antiguo puente de piedra otomano sobre el río Vladayska, a la entrada de la ciudad desde la estación de tren.", "Sus cuatro leones de bronce se han convertido en uno de los símbolos de Sofía y aparecen en muchas fotografías antiguas de la capital. Hoy el puente es también un nudo de tranvías y una estación de metro."]}, "geometry": {"type": "Point", "coordinates": [23.3205, 42.7059]}}, {"type": "Feature", "properties": {"id": "galeria", "nombre": "Galería Nacional (antiguo Palacio Real)", "categoria": "museo", "resumen": "Del konak otomano donde se juzgó a Levski al palacio de los zares.", "historia": ["En este solar estaba el konak, la sede del gobierno otomano, donde en 1873 fue interrogado y juzgado Vasil Levski, el gran héroe de la independencia búlgara. Tras la liberación, el edificio se reconstruyó y amplió como palacio del príncipe Alejandro de Battenberg.", "Fue residencia de los monarcas búlgaros hasta 1946, cuando se abolió la monarquía. Hoy alberga la Galería Nacional de arte y el Museo Etnográfico, y su jardín, frente a la iglesia rusa, es uno de los más tranquilos del centro."]}, "geometry": {"type": "Point", "coordinates": [23.3276, 42.6962]}}, {"type": "Feature", "properties": {"id": "teatro", "nombre": "Teatro Nacional Iván Vázov", "categoria": "edificio", "resumen": "El gran teatro neoclásico de 1907 y el Jardín de la Ciudad, con sus jugadores de ajedrez.", "historia": ["El edificio lo proyectaron los arquitectos vieneses Fellner y Helmer, especialistas en teatros de toda Europa central, y se inauguró en 1907. Tras un incendio en 1923 se reconstruyó, y lleva el nombre del escritor Iván Vázov, el «patriarca de la literatura búlgara».", "Delante se extiende el Jardín de la Ciudad, el parque público más antiguo de Sofía, trazado en la década de 1870. Es famoso por los jubilados que juegan al ajedrez en sus mesas de piedra."]}, "geometry": {"type": "Point", "coordinates": [23.3261, 42.6941]}}, {"type": "Feature", "properties": {"id": "parlamento", "nombre": "Parlamento y Monumento al Zar Libertador", "categoria": "monumento", "resumen": "La Asamblea Nacional de 1884 y la estatua ecuestre de Alejandro II.", "historia": ["El edificio de la Asamblea Nacional se construyó entre 1884 y 1886 según el proyecto del arquitecto Konstantin Jovanović. Sobre su entrada se lee el lema nacional: «La unión hace la fuerza».", "Enfrente, el Monumento al Zar Libertador honra a Alejandro II de Rusia, cuya guerra contra el Imperio otomano trajo la independencia búlgara. Lo realizó el escultor italiano Arnoldo Zocchi y se inauguró en 1907."]}, "geometry": {"type": "Point", "coordinates": [23.333, 42.69375]}}, {"type": "Feature", "properties": {"id": "universidad", "nombre": "Universidad de Sofía", "categoria": "edificio", "resumen": "La universidad más antigua del país, financiada por dos hermanos mecenas.", "historia": ["Fundada en 1888 con el nombre de San Clemente de Ohrid, es la primera universidad de Bulgaria. Su sede principal se construyó en las primeras décadas del siglo XX gracias a la donación de los hermanos Evlogi y Hristo Georgiev, comerciantes búlgaros enriquecidos en Bucarest, cuyas estatuas presiden la entrada.", "El proyecto fue del arquitecto francés Jean Bréasson. Bajo el edificio, el paso subterráneo conserva restos de la muralla de Serdica y de su puerta este."]}, "geometry": {"type": "Point", "coordinates": [23.3348, 42.6935]}}, {"type": "Feature", "properties": {"id": "doctor", "nombre": "Jardín del Doctor", "categoria": "parque", "resumen": "Un jardín tranquilo con un monumento a los médicos de la guerra de liberación y piedras romanas.", "historia": ["Este jardín recibe su nombre del monumento a los médicos y enfermeras que murieron atendiendo a los heridos en la guerra ruso-turca de 1877-1878, inaugurado en 1884.", "Entre sus árboles hay un pequeño lapidario con columnas, capiteles e inscripciones de la Serdica romana. Es uno de los rincones preferidos de los vecinos para pasear al perro o leer al sol."]}, "geometry": {"type": "Point", "coordinates": [23.339, 42.6944]}}, {"type": "Feature", "properties": {"id": "borisova", "nombre": "Parque Borisova Gradina", "categoria": "parque", "resumen": "El gran parque de Sofía, con lagos, estadios y bosques en pleno centro.", "historia": ["Su plantación empezó en 1884, cuando el jardinero suizo Daniel Neff convirtió unos terrenos baldíos en un parque al estilo europeo; lo continuaron otros jardineros durante décadas. Su nombre recuerda al zar Boris III.", "Es el parque más antiguo y grande del centro: tiene el lago Ariana, el estadio nacional Vasil Levski, bosques, jardines de rosas y monumentos de distintas épocas. En verano se llena de corredores, familias y conciertos."]}, "geometry": {"type": "Point", "coordinates": [23.3385, 42.6865]}}, {"type": "Feature", "properties": {"id": "ejercito", "nombre": "Monumento al Ejército Soviético", "categoria": "monumento", "resumen": "El monumento más discutido de Sofía, famoso por sus grafitis.", "historia": ["Se inauguró en 1954, en plena época estalinista, para honrar al ejército soviético que entró en Bulgaria en 1944. Durante décadas fue escenario de actos oficiales del régimen.", "Después de 1989 se convirtió en un símbolo incómodo: en 2011 unos artistas pintaron a sus soldados como superhéroes de cómic, y las imágenes dieron la vuelta al mundo. En 2023 se empezó a desmontar su figura central, en medio de un fuerte debate."]}, "geometry": {"type": "Point", "coordinates": [23.3324, 42.6898]}}, {"type": "Feature", "properties": {"id": "siete", "nombre": "Iglesia de los Siete Santos", "categoria": "religioso", "resumen": "Una mezquita del siglo XVI convertida en iglesia en 1902.", "historia": ["Se construyó en 1528 como Kara Camii, la Mezquita Negra, por el color oscuro de su piedra, y se atribuye a Mimar Sinan. Después de la liberación quedó abandonada y llegó a usarse como prisión.", "Entre 1901 y 1902 los arquitectos Yordan Milanov y Petko Momchilov la transformaron en iglesia ortodoxa dedicada a los siete santos, discípulos de Cirilo y Metodio. Su jardín, en la animada calle Graf Ignatiev, es un punto de encuentro del barrio."]}, "geometry": {"type": "Point", "coordinates": [23.3283, 42.6904]}}, {"type": "Feature", "properties": {"id": "ndk", "nombre": "Palacio Nacional de Cultura (NDK)", "categoria": "edificio", "resumen": "El gigantesco centro de congresos de 1981, al final del bulevar Vitosha.", "historia": ["Se inauguró en 1981 para celebrar los 1.300 años del Estado búlgaro, impulsado por Lyudmila Zhivkova, hija del dirigente comunista Todor Zhivkov. Es uno de los mayores centros de congresos y cultura del sureste de Europa.", "Delante se extiende un gran parque con fuentes que conecta con el bulevar Vitosha, la principal calle peatonal y comercial. El monumento «1.300 años de Bulgaria», que estaba enfrente, se desmontó en 2017."]}, "geometry": {"type": "Point", "coordinates": [23.319, 42.6847]}}, {"type": "Feature", "properties": {"id": "artesocialista", "nombre": "Museo de Arte Socialista", "categoria": "museo", "resumen": "Estatuas de Lenin, Dimitrov y la estrella roja del Partido, reunidas en un jardín.", "historia": ["Inaugurado en 2011, reúne en un parque de esculturas las estatuas y bustos de la época comunista que se retiraron de las calles después de 1989: Lenin, Georgi Dimitrov y obreros y campesinos heroicos.", "Su pieza más llamativa es la estrella roja que coronó la sede del Partido Comunista en el Largo. Dentro se proyectan películas de propaganda de la época."]}, "geometry": {"type": "Point", "coordinates": [23.3509, 42.6699]}}, {"type": "Feature", "properties": {"id": "boyana", "nombre": "Iglesia de Boyana", "categoria": "religioso", "resumen": "Frescos de 1259 al pie del Vitosha, Patrimonio de la Humanidad.", "historia": ["Esta pequeña iglesia de la aldea de Boyana, hoy un barrio de Sofía, se fue ampliando entre los siglos X y XIX. Su segunda fase, de 1259, encargada por el sebastocrátor Kaloyan, guarda uno de los conjuntos de pintura medieval más importantes de Europa.", "Sus retratos de Kaloyan y su esposa Desislava, y escenas como la Última Cena, tienen una expresividad poco habitual para su época. Está en la lista del Patrimonio Mundial de la UNESCO desde 1979; la visita es breve y con aforo limitado para proteger los frescos."]}, "geometry": {"type": "Point", "coordinates": [23.2665, 42.6447]}}, {"type": "Feature", "properties": {"id": "historia", "nombre": "Museo Nacional de Historia", "categoria": "museo", "resumen": "El gran museo de la historia búlgara, en una antigua residencia del gobierno comunista.", "historia": ["Ocupa desde 2000 la antigua residencia gubernamental de Boyana, construida en los años 70 al pie del Vitosha. Sus salas recorren la historia del territorio búlgaro desde la Prehistoria.", "Entre sus tesoros hay oro tracio, piezas romanas y medievales, y una gran colección de arte y objetos de la época de la liberación. Está a un paseo de la iglesia de Boyana, por lo que se visitan juntos."]}, "geometry": {"type": "Point", "coordinates": [23.2646, 42.6527]}}]}, R=[["largo", "arqueologico"], ["banyabashi", "halite"], ["rotonda", "arqueologico"], ["serdica", "rotonda"], ["rotonda", "largo"], ["rusa", "galeria"], ["halite", "sinagoga"], ["serdica", "largo"], ["banyabashi", "banos"], ["nevski", "santasofia"], ["parlamento", "universidad"], ["serdica", "nedelya"], ["nedelya", "rotonda"], ["banyabashi", "sinagoga"], ["serdica", "halite"], ["nevski", "parlamento"], ["santasofia", "rusa"], ["rusa", "teatro"], ["galeria", "teatro"], ["arqueologico", "galeria"], ["largo", "halite"], ["sinagoga", "zhenski"], ["santasofia", "galeria"], ["serdica", "sinagoga"], ["nevski", "universidad"], ["largo", "banos"], ["ejercito", "siete"], ["arqueologico", "teatro"], ["universidad", "doctor"], ["nedelya", "sinagoga"], ["rusa", "parlamento"], ["parlamento", "ejercito"], ["teatro", "siete"], ["universidad", "ejercito"], ["nevski", "doctor"], ["parlamento", "siete"], ["rusa", "siete"], ["zhenski", "leones"], ["borisova", "ejercito"], ["banyabashi", "leones"], ["universidad", "borisova"], ["doctor", "borisova"], ["boyana", "historia"], ["siete", "ndk"], ["teatro", "ndk"], ["nedelya", "ndk"], ["borisova", "artesocialista"], ["ndk", "historia"]];
const f=new ol.format.GeoJSON({featureProjection:'EPSG:3857'}), pf=f.readFeatures(P), c={};
pf.forEach((x,i)=>{x.set('n',i+1);c[x.get('id')]=x.getGeometry().getCoordinates()});
const lin=R.map(([a,b])=>new ol.Feature(new ol.geom.LineString([c[a],c[b]])));
const S=ol.style;
new ol.Map({target:'m',view:new ol.View({center:ol.proj.fromLonLat([23.326,42.695]),zoom:15.3}),layers:[
 new ol.layer.Tile({source:new ol.source.OSM()}),
 new ol.layer.Vector({source:new ol.source.Vector({features:lin}),style:new S.Style({stroke:new S.Stroke({color:'#e0242a',width:4})})}),
 new ol.layer.Vector({source:new ol.source.Vector({features:pf}),style:x=>new S.Style({image:new S.Circle({radius:11,fill:new S.Fill({color:'#a8322a'}),stroke:new S.Stroke({color:'#fff',width:2})}),
   text:new S.Text({text:x.get('n')+'',font:'bold 11px sans-serif',fill:new S.Fill({color:'#fff'})})})}),
 new ol.layer.Vector({source:new ol.source.Vector({features:pf}),declutter:true,style:x=>new S.Style({text:new S.Text({text:x.get('nombre'),offsetY:-20,font:'600 12px sans-serif',fill:new S.Fill({color:'#222'}),stroke:new S.Stroke({color:'#fff',width:4})})})})]});
</script></body></html>
